# Ce que la machine vérifie à chaque poussée.
#
# Les 111 tests ne servent à rien s'ils ne tournent que lorsqu'on y pense. Ils
# couvrent précisément ce qui casse en silence — les allers-retours du binaire
# et des tuiles, la pondération d'itinéraire, le recalage GPS, la couture des
# graphes régionaux, les annonces vocales : des défauts qui ne plantent pas,
# qui donnent des chiffres plausibles et faux, et qu'on ne remarque donc jamais
# à l'usage.
#
# Rien ici ne demande de réseau ni de données calculées : aucun test ne
# télécharge quoi que ce soit, et les graphes sont dessinés à la main. La
# construction du site, elle, est vérifiée parce qu'une erreur d'import ne se
# voit qu'au moment de l'assemblage — les tests portent sur des modules pris un
# par un.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : on installe ce que le verrou décrit,
      # sans le mettre à jour au passage. Un test qui passe ici doit passer sur
      # la machine de développement, avec les mêmes versions. Le navigateur des
      # tests de bout en bout n'a rien à faire ici : il a son propre travail.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # La construction charge tous les modules ensemble : c'est le seul
      # contrôle qui attrape un import cassé ou un fichier oublié.
      - run: npm run build

  # L'application entière dans Chromium : carte, itinéraire, marche guidée au
  # GPS simulé, changement de zone, rechargement hors réseau. C'est ce qui
  # aurait vu le guidage s'interrompre à chaque position — aucun test de module
  # ne le pouvait, le défaut était dans l'assemblage.
  parcours:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm exec --workspace web -- playwright install --with-deps chromium

      - run: npm run test:e2e
